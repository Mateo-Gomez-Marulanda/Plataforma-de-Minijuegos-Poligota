[package]
name = "rustlike"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[[bin]]
name = "rustlike-service"
path = "src/main.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
