# Orquesta todo el sistema: frontend y gateway publican puertos; los servicios de juego
# solo son visibles dentro de la red interna 'minijuegos-net' (se resuelven por nombre).
services:
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    # El servidor de Vite reenvía /api y /ws al gateway por la red interna de Docker.
    environment:
      GATEWAY_URL: http://gateway:3000
    depends_on: [gateway]

  gateway:
    build: ./gateway
    ports: ["3000:3000"]
    depends_on: [sudoku-service, buscaminas-service, snake-service, tetris-service, asteroids-service, blackjack-service]

  sudoku-service:
    build: ./services/sudoku-python
    expose: ["8001"]

  buscaminas-service:
    build: ./services/buscaminas-java
    expose: ["8002"]

  snake-service:
    build: ./services/snake-elixir
    expose: ["8003"]

  tetris-service:
    build: ./services/tetris-csharp
    expose: ["8004"]

  asteroids-service:
    build: ./services/asteroids-go
    expose: ["8005"]

  blackjack-service:
    build: ./services/blackjack-kotlin
    expose: ["8006"]

networks:
  default:
    name: minijuegos-net
